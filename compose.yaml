services:
  app:
    build:
      context: .
    environment:
      DATABASE_URL: postgresql+psycopg://matchwell:${POSTGRES_PASSWORD:-matchwell_dev}@db:5432/matchwell
      MATCHWELL_ADMIN_EMAILS: ${MATCHWELL_ADMIN_EMAILS:-admin@example.com}
      MATCHWELL_AUTO_MIGRATE: "true"
      MATCHWELL_ENVIRONMENT: development
    ports:
      - "7860:7860"
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: matchwell
      POSTGRES_USER: matchwell
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-matchwell_dev}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U matchwell -d matchwell"]
      interval: 5s
      timeout: 5s
      retries: 10
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data

volumes:
  postgres-data:
